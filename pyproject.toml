[project]
name = "oas-simulator"
version = "0.1.0"
description = "OAS vehicle and CAN simulation tools"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pyright>=1.1", "ruff>=0.9"]

[tool.ruff]
target-version = "py312"

[tool.pyright]
include = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
